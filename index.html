<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Craft - Single File Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
            background: #000;
            user-select: none;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
        }
        #crosshair::before { top: 4px; left: 0; width: 10px; height: 2px; }
        #crosshair::after { top: 0; left: 4px; width: 2px; height: 10px; }
        
        #ui {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            border-radius: 8px;
            pointer-events: none;
        }
        .slot {
            width: 50px;
            height: 50px;
            border: 2px solid #555;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 12px;
            border-radius: 4px;
        }
        .slot.active {
            border-color: #ffcc00;
            transform: scale(1.1);
        }
        #instructions {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 8px;
            pointer-events: none;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div id="crosshair"></div>
    
    <div id="instructions">
        <strong>Controls:</strong><br>
        Click screen to play<br>
        WASD: Move | SPACE: Jump<br>
        MOUSE: Look Around<br>
        LEFT CLICK: Destroy Block<br>
        RIGHT CLICK: Place Block<br>
        1-3: Select Material
    </div>

    <div id="ui">
        <div class="slot active" id="slot-1">Grass</div>
        <div class="slot" id="slot-2">Dirt</div>
        <div class="slot" id="slot-3">Stone</div>
    </div>

    <!-- Include Three.js and PointerLockControls from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

    <script>
        // --- GAME INITIALIZATION ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Sky blue
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.PointerLockControls(camera, document.body);

        document.body.addEventListener('click', () => {
            controls.lock();
        });

        // --- LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
        sunLight.position.set(50, 100, 50);
        scene.add(sunLight);

        // --- TEXTURES & MATERIALS ---
        const loader = new THREE.TextureLoader();
        
        // Simple procedural color materials as fallback/base
        const materials = {
            1: new THREE.MeshLambertMaterial({ color: 0x55aa55 }), // Grass
            2: new THREE.MeshLambertMaterial({ color: 0x8B4513 }), // Dirt
            3: new THREE.MeshLambertMaterial({ color: 0x808080 })  // Stone
        };

        let selectedMaterialId = 1;

        // --- WORLD GENERATION ---
        const worldSize = 20; // Size of the world grid
        const blockSize = 1;
        const cubes = [];
        
        // Setup raycaster for block interaction
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2(0, 0); // Center of screen

        // Geometry shared by all blocks
        const boxGeometry = new THREE.BoxGeometry(blockSize, blockSize, blockSize);

        function createBlock(x, y, z, type) {
            const mesh = new THREE.Mesh(boxGeometry, materials[type]);
            mesh.position.set(x * blockSize, y * blockSize, z * blockSize);
            scene.add(mesh);
            cubes.push(mesh);
            return mesh;
        }

        // Generate terrain
        for (let x = -worldSize / 2; x < worldSize / 2; x++) {
            for (let z = -worldSize / 2; z < worldSize / 2; z++) {
                // Simple height map using sine/cosine waves
                let height = Math.floor(Math.sin(x * 0.3) * Math.cos(z * 0.3) * 2) + 2;
                
                for (let y = 0; y <= height; y++) {
                    let type = (y === height) ? 1 : (y > height - 2 ? 2 : 3);
                    createBlock(x, y, z, type);
                }
            }
        }

        // --- CONTROLS & MOVEMENT ---
        const moveState = { forward: false, backward: false, left: false, right: false };
        let velocityY = 0;
        const gravity = 0.015;
        const jumpSpeed = 0.3;

        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW') moveState.forward = true;
            if (e.code === 'KeyS') moveState.backward = true;
            if (e.code === 'KeyA') moveState.left = true;
            if (e.code === 'KeyD') moveState.right = true;
            if (e.code === 'Space' && camera.position.y <= 5) velocityY = jumpSpeed;

            // Hotbar selection
            if (['Digit1', 'Digit2', 'Digit3'].includes(e.code)) {
                document.querySelectorAll('.slot').forEach(s => s.classList.remove('active'));
                selectedMaterialId = parseInt(e.code.replace('Digit', ''));
                document.getElementById(`slot-${selectedMaterialId}`).classList.add('active');
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') moveState.forward = false;
            if (e.code === 'KeyS') moveState.backward = false;
            if (e.code === 'KeyA') moveState.left = false;
            if (e.code === 'KeyD') moveState.right = false;
        });

        // --- MOUSE INTERACTIONS (BUILD / DESTROY) ---
        window.addEventListener('mousedown', (e) => {
            if (!controls.isLocked) return;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(cubes);

            if (intersects.length > 0) {
                const intersect = intersects[0];

                if (e.button === 0) { 
                    // Left Click: Destroy Block
                    scene.remove(intersect.object);
                    const index = cubes.indexOf(intersect.object);
                    if (index > -1) cubes.splice(index, 1);
                } else if (e.button === 2) { 
                    // Right Click: Place Block
                    const position = intersect.object.position.clone().add(intersect.face.normal);
                    
                    // Prevent placing block inside player space
                    if (Math.abs(camera.position.x - position.x) > 0.6 || 
                        Math.abs(camera.position.z - position.z) > 0.6 || 
                        Math.abs(camera.position.y - position.y) > 1.2) {
                        createBlock(position.x, position.y, position.z, selectedMaterialId);
                    }
                }
            }
        });

        // Prevent context menu from popping up on right-click
        window.addEventListener('contextmenu', e => e.preventDefault());

        // --- GAME LOOP ---
        let prevTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            if (controls.isLocked) {
                // Movement physics
                const speed = 4.0 * delta;
                if (moveState.forward) controls.moveForward(speed);
                if (moveState.backward) controls.moveForward(-speed);
                if (moveState.left) controls.moveRight(-speed);
                if (moveState.right) controls.moveRight(speed);

                // Vertical gravity simulation
                velocityY -= gravity;
                camera.position.y += velocityY;

                // Floor collision check
                if (camera.position.y < 4) {
                    camera.position.y = 4;
                    velocityY = 0;
                }
            }

            prevTime = time;
            renderer.render(scene, camera);
        }

        animate();

        // Handle window resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
